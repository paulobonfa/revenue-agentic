name: Production gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run production gate
        run: python scripts/validate_production.py
      - name: Compile Python sources
        run: python -m compileall -q revenue_mechanics.py reliability_registry.py scripts skills/revenue-mechanics/scripts agent
